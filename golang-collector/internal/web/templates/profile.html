{{define "content"}}

<!-- =====================================================================
     HALAMAN PROFIL — UBAH PASSWORD MANDIRI
     Tersedia untuk semua role (admin, operator, viewer).
     ===================================================================== -->

<div class="max-w-lg">
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h3 class="font-bold text-gray-800 mb-1">Akun Saya</h3>
        <div class="text-sm text-gray-600 space-y-1 mt-3">
            <div class="flex justify-between py-1.5 border-b border-gray-100">
                <span class="text-gray-500">Username</span>
                <span class="font-medium text-gray-800">{{.Username}}</span>
            </div>
            <div class="flex justify-between py-1.5">
                <span class="text-gray-500">Role</span>
                <span class="font-medium text-gray-800 capitalize">{{.Role}}</span>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="font-bold text-gray-800 mb-4">Ubah Password</h3>
        <form method="POST" action="/profile/password" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Password Lama</label>
                <input type="password" name="old_password" required autocomplete="current-password"
                       class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Password Baru</label>
                <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">Minimal 8 karakter. Gunakan kombinasi huruf, angka, dan simbol.</p>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full px-4 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors">
                Simpan Password Baru
            </button>
        </form>
    </div>
</div>
{{end}}
