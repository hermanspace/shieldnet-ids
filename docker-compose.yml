# =============================================================================
# Orkestrasi semua service Sistem Deteksi Intrusi Kolaboratif
# Menjalankan: TimescaleDB, Redis, Golang Collector, Python Analyst, Grafana
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: Database time-series untuk menyimpan syslog dan hasil deteksi
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ids-timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ids_thesis}
      POSTGRES_USER: ${DB_USER:-ids_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ids_password}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Diikat ke loopback: database hanya perlu diakses antar-container
      # (jaringan internal Docker) dan untuk debugging dari host. JANGAN
      # diekspos ke publik — UFW tidak melindungi port yang di-publish Docker.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ids_user} -d ${DB_NAME:-ids_thesis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis: Message broker untuk komunikasi Golang ↔ Python
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ids-redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      # Diikat ke loopback — alasan sama dengan TimescaleDB di atas
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Golang Collector: Menerima syslog, mengelola web interface, mendistribusikan access list
  # ---------------------------------------------------------------------------
  golang-collector:
    build:
      context: ./golang-collector
      dockerfile: Dockerfile
    container_name: ids-golang
    restart: always
    env_file: .env
    environment:
      DB_HOST: timescaledb
      REDIS_HOST: redis
      TZ: Asia/Jakarta
    ports:
      # WEB_BIND=127.0.0.1 (di .env) mengunci dashboard ke loopback saat
      # berada di belakang reverse proxy (Caddy/nginx) — lihat docs/deploy-vps.md
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
      - "${SYSLOG_UDP_PORT:-514}:514/udp"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./golang-collector/static:/app/static

  # ---------------------------------------------------------------------------
  # Python Analyst: Analisis Isolation Forest dan publikasi hasil ke Redis
  # ---------------------------------------------------------------------------
  python-analyst:
    build:
      context: ./python-analyst
      dockerfile: Dockerfile
    container_name: ids-python
    restart: always
    env_file: .env
    environment:
      DB_HOST: timescaledb
      REDIS_HOST: redis
      TZ: Asia/Jakarta
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  # ---------------------------------------------------------------------------
  # Grafana: Dashboard visualisasi real-time dari TimescaleDB
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: ids-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_SERVER_HTTP_PORT: 3000
      GF_AUTH_ANONYMOUS_ENABLED: false
      TZ: Asia/Jakarta
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Jakarta
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      # Diikat ke loopback: akses via SSH tunnel bila diperlukan
      # (ssh -L 3000:localhost:3000 user@vps), atau lewat reverse proxy
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  redis_data:
  grafana_data:
  model_data:
