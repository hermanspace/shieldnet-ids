# =============================================================================
# Konfigurasi utama Grafana untuk Sistem Deteksi Intrusi
# =============================================================================

[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = admin123
# Izinkan embedding iframe dari web interface Golang
allow_embedding = true

[auth.anonymous]
# Nonaktifkan akses anonim agar dashboard hanya bisa diakses user terdaftar
enabled = false

[dashboards]
# Path default untuk provisioning dashboard
versions_to_keep = 20

[date_formats]
default_timezone = Asia/Jakarta

[log]
mode = console
level = warn

[analytics]
# Nonaktifkan pengiriman data penggunaan ke Grafana Labs
reporting_enabled = false
check_for_updates = false

[plugins]
allow_loading_unsigned_plugins = grafana-piechart-panel
