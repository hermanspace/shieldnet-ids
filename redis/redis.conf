# =============================================================================
# Konfigurasi Redis untuk Sistem Deteksi Intrusi Kolaboratif
# Redis digunakan sebagai message broker antara Golang dan Python Analyst
# =============================================================================

# Bind ke semua interface agar bisa diakses dari container lain
bind 0.0.0.0

# Port standar Redis
port 6379

# Mode protected dinonaktifkan karena berjalan dalam jaringan Docker internal
protected-mode no

# Simpan data ke disk setiap 60 detik jika ada minimal 1 perubahan
# Ini memastikan data stream tidak hilang saat container restart
save 60 1
save 300 10
save 900 1

# Lokasi file data persistence
dir /data
dbfilename dump.rdb

# Aktifkan AOF (Append Only File) untuk durabilitas lebih baik
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Batas maksimal memori (sesuaikan dengan kebutuhan server)
maxmemory 256mb

# Kebijakan saat memori penuh: hapus key yang paling jarang diakses
maxmemory-policy allkeys-lru

# Log level: notice untuk lingkungan produksi
loglevel notice

# Timeout koneksi klien yang tidak aktif (0 = tidak pernah timeout)
timeout 0

# Aktifkan keepalive TCP
tcp-keepalive 300
